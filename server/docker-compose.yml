name: family-health-data

x-db-image: &db-image timescale/timescaledb-ha:pg17.11-ts2.29.2
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"
x-app: &app
  restart: unless-stopped
  logging: *logging
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  cpus: 0.5
  mem_limit: 512m
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 60s

# Build this checkout with compose.build.yml. No upstream shared-mode image is used.
# MCP, Grafana, backup and external ingress remain disabled pending their own gates.
services:
  init-secrets:
    image: node@sha256:7c76769f1afc177f5d8f55330c9123b2d869f05077022c28bf91c74e6216721f
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    entrypoint: [node, /puls/init-secrets.mjs]
    command: [/secrets, /pgdata, /settings.env]
    volumes:
      - ../web/scripts:/puls:ro
      - type: bind
        source: ./.env
        target: /settings.env
        read_only: true
        bind:
          create_host_path: false
      - db_data:/pgdata:ro
      - db_secrets:/secrets/db
      - migrate_secrets:/secrets/migrate
      - api_secrets:/secrets/api
      - ingest_secrets:/secrets/ingest
      - web_secrets:/secrets/web
      - auth_signing:/secrets/signing
      - auth_public:/secrets/public

  db:
    image: *db-image
    restart: unless-stopped
    logging: *logging
    cpus: 1
    mem_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db/POSTGRES_PASSWORD
    volumes:
      - db_data:/home/postgres/pgdata/data
      - db_secrets:/run/secrets/db:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      init-secrets:
        condition: service_completed_successfully

  migrate:
    image: *db-image
    restart: "no"
    user: "1000:1000"
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    cpus: 0.5
    mem_limit: 512m
    entrypoint: [bash, /puls/run-migrate.sh]
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db/POSTGRES_PASSWORD
      GRAFANA_DB_PASSWORD_FILE: /run/secrets/migrate/GRAFANA_DB_PASSWORD
      API_DB_PASSWORD_FILE: /run/secrets/migrate/API_DB_PASSWORD
      INGEST_DB_PASSWORD_FILE: /run/secrets/migrate/INGEST_DB_PASSWORD
      WEB_DB_PASSWORD_FILE: /run/secrets/migrate/WEB_DB_PASSWORD
      MIGRATIONS_DIR: /puls/migrations
      WEB_PERSONAL_USERS: ${WEB_PERSONAL_USERS:-}
      PULS_TIME_ZONE: ${PULS_TIME_ZONE:-UTC}
    volumes:
      - ./db/run-migrate.sh:/puls/run-migrate.sh:ro
      - ./db/migrate.sh:/puls/migrate.sh:ro
      - ./db/migrations:/puls/migrations:ro
      - db_secrets:/run/secrets/db:ro
      - migrate_secrets:/run/secrets/migrate:ro
    depends_on:
      db:
        condition: service_healthy

  ingest:
    <<: *app
    image: family-health-ingest:${DEPLOY_COMMIT:-unbuilt}
    user: "65533:65533"
    stop_grace_period: 30s
    environment:
      DATABASE_URL_FILE: /run/secrets/ingest/DATABASE_URL
      PULS_PUBLIC_URL: ${PULS_PUBLIC_URL:-}
      LISTEN_ADDR: ":8080"
      PULS_MAX_INFLIGHT_BATCHES: ${PULS_MAX_INFLIGHT_BATCHES:-4}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    volumes:
      - ingest_secrets:/run/secrets/ingest:ro
    healthcheck:
      <<: *health
      test: [CMD, /ingest, healthcheck]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    image: family-health-api:${DEPLOY_COMMIT:-unbuilt}
    user: "65532:65532"
    stop_grace_period: 30s
    environment:
      DATABASE_URL_FILE: /run/secrets/api/DATABASE_URL
      LISTEN_ADDR: ":8081"
      PULS_TIME_ZONE: ${PULS_TIME_ZONE:-UTC}
      PULS_AUTH_ISSUER: ${WEB_PUBLIC_URL:?set the private viewer origin}
      PULS_AUTH_PUBLIC_KEYS_FILE: ${PULS_AUTH_PUBLIC_KEYS_FILE:-/auth-public/key-v1.json}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    volumes:
      - api_secrets:/run/secrets/api:ro
      - auth_public:/auth-public:ro
    healthcheck:
      <<: *health
      test: [CMD, /api, healthcheck]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    image: family-health-web:${DEPLOY_COMMIT:-unbuilt}
    user: "1001:1001"
    mem_limit: 1g
    environment:
      DATABASE_URL_FILE: /run/secrets/web/DATABASE_URL
      WEB_ACCOUNTS: "true"
      PULS_TIME_ZONE: ${PULS_TIME_ZONE:-UTC}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      WEB_CLIENT_IP_HEADER: ${WEB_CLIENT_IP_HEADER:-x-forwarded-for}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?set the private viewer origin}
      WEB_DB_POOL_SIZE: ${WEB_DB_POOL_SIZE:-4}
      WEB_SIGNUPS: ${WEB_SIGNUPS:-false}
      WEB_INGEST_URL: ${PULS_PUBLIC_URL:-}
      WEB_SES_REGION: ${WEB_SES_REGION:-us-east-1}
      WEB_SES_ACCESS_KEY_ID_FILE: ${WEB_SES_ACCESS_KEY_ID_FILE:-}
      WEB_SES_SECRET_ACCESS_KEY_FILE: ${WEB_SES_SECRET_ACCESS_KEY_FILE:-}
      WEB_MAIL_FROM: ${WEB_MAIL_FROM:-}
      WEB_ADMIN_EMAIL: ${WEB_ADMIN_EMAIL:-}
      WEB_APP_STORE_ALERT_TO: ${WEB_APP_STORE_ALERT_TO:-}
      PULS_AUTH_PRIVATE_KEY_FILE: ${PULS_AUTH_PRIVATE_KEY_FILE:-/auth-keys/key-v1.pem}
      PULS_AUTH_PUBLIC_KEYS_FILE: ${PULS_AUTH_PUBLIC_KEYS_FILE:-/auth-public/key-v1.json}
      PULS_AUTH_KEY_ID: ${PULS_AUTH_KEY_ID:-key-v1}
      PULS_MCP_URL: ${PULS_MCP_URL:-${WEB_PUBLIC_URL}/mcp}
      PULS_API_URL: http://api:8081
      PULS_DELETION_LEDGER_DIR: ${PULS_DELETION_LEDGER_DIR:-}
    volumes:
      - web_secrets:/run/secrets/web:ro
      - auth_signing:/auth-keys
      - auth_public:/auth-public
      - deletion_ledger:/deletion-ledger
    healthcheck:
      <<: *health
      interval: 30s
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  db_secrets:
  migrate_secrets:
  api_secrets:
  ingest_secrets:
  web_secrets:
  auth_signing:
  auth_public:
  deletion_ledger:
